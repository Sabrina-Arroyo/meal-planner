<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Planner</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f3ef;
    color: #292929;
}

header {
    background: #292929;
    color: white;
    padding: 24px 20px;
    text-align: center;
}

header h1 {
    margin: 0 0 6px;
    font-size: 28px;
}

header p {
    margin: 0;
    opacity: .8;
}

nav {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 10px;
    background: white;
    border-bottom: 1px solid #ddd;
    overflow-x: auto;
}

nav button {
    background: transparent;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    font-size: 14px;
}

nav button:hover {
    background: #eee;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 24px 16px 50px;
}

.page-heading {
    margin-bottom: 18px;
}

.page-heading h2 {
    margin: 0 0 6px;
}

.page-heading p {
    margin: 0;
    color: #666;
}

/* VIEW BUTTONS */

.view-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.view-button {
    border: 1px solid #ccc;
    background: white;
    color: #292929;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}

.view-button.active {
    background: #292929;
    color: white;
}

/* MEAL TYPE VIEW */

.meal-section {
    background: white;
    border-radius: 14px;
    margin-bottom: 18px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.meal-section h3 {
    margin: 0 0 15px;
    font-size: 18px;
}

.week-row {
    display: grid;
    grid-template-columns: repeat(7, minmax(120px, 1fr));
    gap: 8px;
}

.day-cell {
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
}

.day-name {
    background: #f0eee9;
    padding: 8px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
}

.meal-input {
    width: 100%;
    min-height: 52px;
    border: none;
    padding: 9px;
    font-size: 13px;
    resize: vertical;
}

.meal-input:focus {
    outline: 2px solid #aaa;
}

/* CALENDAR VIEW */

.calendar {
    display: grid;
    grid-template-columns: repeat(7, minmax(130px, 1fr));
    min-width: 910px;
}

.calendar-wrapper {
    overflow-x: auto;
    background: white;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.calendar-day {
    border-right: 1px solid #ddd;
}

.calendar-day:last-child {
    border-right: none;
}

.calendar-header {
    background: #292929;
    color: white;
    padding: 12px 8px;
    text-align: center;
    font-weight: bold;
}

.calendar-meal {
    padding: 10px;
    border-bottom: 1px solid #eee;
    min-height: 70px;
}

.calendar-meal-label {
    display: block;
    font-size: 11px;
    font-weight: bold;
    color: #666;
    margin-bottom: 5px;
}

.calendar-meal-value {
    font-size: 13px;
}

/* DAY VIEW */

.day-selector {
    width: 100%;
    max-width: 400px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
    font-size: 16px;
    margin-bottom: 18px;
}

.day-meals {
    background: white;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.day-meal {
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.day-meal:last-child {
    border-bottom: none;
}

.day-meal-label {
    font-weight: bold;
    margin-bottom: 7px;
}

.day-meal input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

/* SAVE */

.save-button {
    display: block;
    margin: 22px auto 0;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    background: #292929;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.save-message {
    text-align: center;
    min-height: 20px;
    margin-top: 10px;
    color: #555;
}

@media (max-width: 700px) {

    main {
        padding: 20px 12px 40px;
    }

    .week-row {
        grid-template-columns: repeat(7, 120px);
        overflow-x: auto;
    }

    .meal-section {
        overflow-x: auto;
    }
}
</style>
</head>

<body>

<header>
    <h1>Meal Planner</h1>
    <p>Plan meals. Build your grocery list.</p>
</header>

<nav>
    <button>🏠 Home</button>
    <button>📅 Meal Plan</button>
    <button>🍳 Recipes</button>
    <button>🛒 Grocery List</button>
    <button>📦 Pantry</button>
</nav>

<main>

    <div class="page-heading">
        <h2>This Week</h2>
        <p>Choose your meals for the week.</p>
    </div>

    <div class="view-buttons">
        <button class="view-button active" onclick="showView('type', this)">
            🍽️ Meal Type
        </button>

        <button class="view-button" onclick="showView('calendar', this)">
            📅 Calendar
        </button>

        <button class="view-button" onclick="showView('day', this)">
            📆 Day
        </button>
    </div>

    <div id="content"></div>

    <button class="save-button" onclick="saveMealPlan()">
        Save Meal Plan
    </button>

    <div class="save-message" id="saveMessage"></div>

</main>

<script>

const days = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
];

const meals = [
    { key: "breakfast", name: "🍳 Breakfast" },
    { key: "drink", name: "🥤 Drink" },
    { key: "lunch", name: "🥪 Lunch" },
    { key: "snack", name: "🍎 Snack" },
    { key: "dinner", name: "🍽️ Dinner" }
];

let mealPlan = {};

function loadMealPlan() {

    const saved = localStorage.getItem("mealPlanner");

    if (saved) {
        mealPlan = JSON.parse(saved);
    }

    renderMealTypeView();
}

function getMeal(dayIndex, mealKey) {

    const key = dayIndex + "_" + mealKey;

    return mealPlan[key] || "";
}

function setMeal(dayIndex, mealKey, value) {

    const key = dayIndex + "_" + mealKey;

    mealPlan[key] = value;
}

function renderMealTypeView() {

    const content = document.getElementById("content");

    content.innerHTML = "";

    meals.forEach(meal => {

        const section = document.createElement("section");

        section.className = "meal-section";

        const title = document.createElement("h3");

        title.textContent = meal.name;

        section.appendChild(title);

        const row = document.createElement("div");

        row.className = "week-row";

        days.forEach((day, index) => {

            const cell = document.createElement("div");

            cell.className = "day-cell";

            const dayName = document.createElement("div");

            dayName.className = "day-name";

            dayName.textContent = day.substring(0, 3);

            const input = document.createElement("textarea");

            input.className = "meal-input";

            input.placeholder = "+ Add";

            input.value = getMeal(index, meal.key);

            input.oninput = function() {
                setMeal(index, meal.key, input.value);
            };

            cell.appendChild(dayName);
            cell.appendChild(input);

            row.appendChild(cell);
        });

        section.appendChild(row);

        content.appendChild(section);
    });
}

function renderCalendarView() {

    const content = document.getElementById("content");

    content.innerHTML = "";

    const wrapper = document.createElement("div");

    wrapper.className = "calendar-wrapper";

    const calendar = document.createElement("div");

    calendar.className = "calendar";

    days.forEach((day, dayIndex) => {

        const column = document.createElement("div");

        column.className = "calendar-day";

        const header = document.createElement("div");

        header.className = "calendar-header";

        header.textContent = day;

        column.appendChild(header);

        meals.forEach(meal => {

            const box = document.createElement("div");

            box.className = "calendar-meal";

            const label = document.createElement("span");

            label.className = "calendar-meal-label";

            label.textContent = meal.name;

            const value = document.createElement("div");

            value.className = "calendar-meal-value";

            value.textContent =
                getMeal(dayIndex, meal.key) || "—";

            box.appendChild(label);
            box.appendChild(value);

            column.appendChild(box);
        });

        calendar.appendChild(column);
    });

    wrapper.appendChild(calendar);

    content.appendChild(wrapper);
}

function renderDayView() {

    const content = document.getElementById("content");

    content.innerHTML = "";

    const selector = document.createElement("select");

    selector.className = "day-selector";

    days.forEach((day, index) => {

        const option = document.createElement("option");

        option.value = index;

        option.textContent = day;

        selector.appendChild(option);
    });

    const mealsContainer = document.createElement("div");

    mealsContainer.className = "day-meals";

    function renderSelectedDay() {

        mealsContainer.innerHTML = "";

        const dayIndex = Number(selector.value);

        meals.forEach(meal => {

            const box = document.createElement("div");

            box.className = "day-meal";

            const label = document.createElement("div");

            label.className = "day-meal-label";

            label.textContent = meal.name;

            const input = document.createElement("input");

            input.type = "text";

            input.placeholder = "Add a meal...";

            input.value =
                getMeal(dayIndex, meal.key);

            input.oninput = function() {

                setMeal(
                    dayIndex,
                    meal.key,
                    input.value
                );
            };

            box.appendChild(label);
            box.appendChild(input);

            mealsContainer.appendChild(box);
        });
    }

    selector.onchange = renderSelectedDay;

    content.appendChild(selector);
    content.appendChild(mealsContainer);

    renderSelectedDay();
}

function showView(view, button) {

    document.querySelectorAll(".view-button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    if (view === "type") {
        renderMealTypeView();
    }

    if (view === "calendar") {
        renderCalendarView();
    }

    if (view === "day") {
        renderDayView();
    }
}

function saveMealPlan() {

    localStorage.setItem(
        "mealPlanner",
        JSON.stringify(mealPlan)
    );

    document.getElementById("saveMessage").textContent =
        "Meal plan saved.";

    setTimeout(() => {

        document.getElementById("saveMessage").textContent = "";

    }, 2500);
}

loadMealPlan();

</script>

</body>
</html>

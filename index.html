<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f3ef;
            color: #292929;
        }

        header {
            background: #292929;
            color: white;
            padding: 24px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1, h2 {
            margin-top: 0;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            background: #292929;
            color: white;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<header>
    <h1>Meal Planner</h1>
    <p>Plan meals. Build your grocery list.</p>
</header>

<main>

    <div class="card">
        <h2>This Week</h2>
        <p>Your weekly meal plan will go here.</p>
        <button>Plan a Meal</button>
    </div>

    <div class="card">
        <h2>Recipes</h2>
        <p>Your recipe collection will go here.</p>
        <button>View Recipes</button>
    </div>

    <div class="card">
        <h2>Grocery List</h2>
        <p>Your automatically calculated grocery list will go here.</p>
        <button>View Grocery List</button>
    </div>

</main>

</body>
</html>

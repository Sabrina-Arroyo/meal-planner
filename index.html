<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Planner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4f0;
      color: #2f2a26;
    }

    header {
      background: #3f3548;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: 0.85;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    nav button {
      border: none;
      background: #eee9e5;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    nav button:hover {
      background: #ddd5cf;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .page-title {
      margin-bottom: 20px;
    }

    .page-title h2 {
      margin: 0 0 5px;
    }

    .page-title p {
      margin: 0;
      color: #6c625c;
    }

    .view-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .view-buttons button {
      border: none;
      background: #ddd5cf;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .view-buttons button.active {
      background: #3f3548;
      color: white;
    }

    .meal-section {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .meal-section h3 {
      margin: 0 0 14px;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(100px, 1fr));
      gap: 10px;
      overflow-x: auto;
    }

    .day-column {
      min-width: 100px;
    }

    .day-label {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 6px;
      text-align: center;
    }

    textarea,
    input,
    select {
      width: 100%;
      border: 1px solid #d4ccc5;
      border-radius: 8px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      background: #fff;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(130px, 1fr));
      gap: 10px;
      overflow-x: auto;
    }

    .calendar-day {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      min-width: 130px;
    }

    .calendar-day h3 {
      margin: 0 0 12px;
      text-align: center;
    }

    .calendar-meal {
      margin-bottom: 10px;
    }

    .calendar-meal-label {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #665b54;
    }

    .calendar-meal-value {
      background: #f5f1ed;
      border-radius: 7px;
      padding: 8px;
      min-height: 35px;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .day-view {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .day-selector {
      max-width: 300px;
      margin-bottom: 20px;
    }

    .day-meal {
      margin-bottom: 16px;
    }

    .day-meal h3 {
      margin-bottom: 7px;
    }

    .save-area {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .save-button,
    .danger-button {
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .save-button {
      background: #3f3548;
      color: white;
    }

    .danger-button {
      background: #8b3a3a;
      color: white;
    }

    .save-button:hover,
    .danger-button:hover {
      opacity: 0.85;
    }

    .empty-message {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      color: #6c625c;
    }

    @media (max-width: 700px) {
      header h1 {
        font-size: 24px;
      }

      main {
        padding: 18px 10px 40px;
      }

      .week-grid {
        grid-template-columns: repeat(7, 110px);
      }

      .calendar-grid {
        grid-template-columns: repeat(7, 140px);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Meal Planner</h1>
    <p>Plan meals. Build your grocery list.</p>
  </header>

  <nav>
    <button>Home</button>
    <button>Meal Plan</button>
<button onclick="window.location.href='recipes.html'">Recipes</button>
    <button>Grocery List</button>
    <button>Pantry</button>
  </nav>

  <main>

    <div class="page-title">
      <h2>This Week</h2>
      <p>Choose your meals for the week.</p>
    </div>

    <div class="view-buttons">
      <button id="mealTypeButton" onclick="showView('mealType')">
        🍽️ Meal Type
      </button>

      <button id="calendarButton" onclick="showView('calendar')">
        📅 Calendar
      </button>

      <button id="dayButton" onclick="showView('day')">
        📆 Day
      </button>
    </div>

    <div id="planner"></div>

    <div class="save-area">
      <button class="save-button" onclick="savePlan()">
        Save
      </button>

      <button class="danger-button" onclick="startNewWeek()">
        Start New Week
      </button>
    </div>

  </main>

  <script>

    const days = [
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday",
      "Sunday"
    ];

    const meals = [
      {
        key: "breakfast",
        name: "🍳 Breakfast"
      },
      {
        key: "drink",
        name: "🥤 Drink"
      },
      {
        key: "lunch",
        name: "🥪 Lunch"
      },
      {
        key: "snack",
        name: "🍎 Snack"
      },
      {
        key: "dinner",
        name: "🍽️ Dinner"
      }
    ];

    let mealPlan = JSON.parse(
      localStorage.getItem("mealPlanner") || "{}"
    );

    let currentView = "mealType";
    let selectedDay = 0;


    function getKey(dayIndex, mealKey) {
      return `${dayIndex}_${mealKey}`;
    }


    function showView(view) {
      currentView = view;

      document.getElementById("mealTypeButton").classList.remove("active");
      document.getElementById("calendarButton").classList.remove("active");
      document.getElementById("dayButton").classList.remove("active");

      if (view === "mealType") {
        document.getElementById("mealTypeButton").classList.add("active");
        renderMealTypeView();
      }

      if (view === "calendar") {
        document.getElementById("calendarButton").classList.add("active");
        renderCalendarView();
      }

      if (view === "day") {
        document.getElementById("dayButton").classList.add("active");
        renderDayView();
      }
    }


    function renderMealTypeView() {

      const planner = document.getElementById("planner");

      planner.innerHTML = "";

      meals.forEach(meal => {

        const section = document.createElement("div");
        section.className = "meal-section";

        section.innerHTML = `
          <h3>${meal.name}</h3>

          <div class="week-grid">

            ${days.map((day, index) => {

              const key = getKey(index, meal.key);

              return `
                <div class="day-column">

                  <div class="day-label">
                    ${day}
                  </div>

<div class="meal-entry">
  <select class="recipe-picker" data-meal-key="${key}">
    <option value="">Choose a saved recipe...</option>
  </select>

  <textarea
    id="${key}"
    placeholder="Add meal..."
  >${mealPlan[key] || ""}</textarea>
</div>

                </div>
              `;

            }).join("")}

          </div>
        `;

        planner.appendChild(section);

      });

    }


    function renderCalendarView() {

      const planner = document.getElementById("planner");

      planner.innerHTML = `
        <div class="calendar-grid">

          ${days.map((day, dayIndex) => {

            return `
              <div class="calendar-day">

                <h3>${day}</h3>

                ${meals.map(meal => {

                  const key = getKey(dayIndex, meal.key);

                  return `
                    <div class="calendar-meal">

                      <div class="calendar-meal-label">
                        ${meal.name}
                      </div>

                      <div class="calendar-meal-value">
                        ${mealPlan[key] || "—"}
                      </div>

                    </div>
                  `;

                }).join("")}

              </div>
            `;

          }).join("")}

        </div>
      `;

    }


    function renderDayView() {

      const planner = document.getElementById("planner");

      planner.innerHTML = `
        <div class="day-view">

          <div class="day-selector">

            <label for="selectedDay">
              <strong>Select a day</strong>
            </label>

            <select
              id="selectedDay"
              onchange="changeSelectedDay(this.value)"
            >

              ${days.map((day, index) => `
                <option
                  value="${index}"
                  ${index === selectedDay ? "selected" : ""}
                >
                  ${day}
                </option>
              `).join("")}

            </select>

          </div>

          ${meals.map(meal => {

            const key = getKey(selectedDay, meal.key);

            return `
              <div class="day-meal">

                <h3>${meal.name}</h3>

                <div class="meal-entry">
  <select class="recipe-picker" data-meal-key="${key}">
    <option value="">Choose a saved recipe...</option>
  </select>

  <textarea
    id="day_${key}"
    placeholder="Add meal..."
  >${mealPlan[key] || ""}</textarea>
</div>

              </div>
            `;

          }).join("")}

        </div>
      `;

    }


    function changeSelectedDay(value) {

      selectedDay = Number(value);

      renderDayView();

    }


    function collectMealTypeInputs() {

      meals.forEach(meal => {

        days.forEach((day, index) => {

          const key = getKey(index, meal.key);

          const input = document.getElementById(key);

          if (input) {
            mealPlan[key] = input.value;
          }

        });

      });

    }


    function collectDayInputs() {

      meals.forEach(meal => {

        const key = getKey(selectedDay, meal.key);

        const input = document.getElementById(`day_${key}`);

        if (input) {
          mealPlan[key] = input.value;
        }

      });

    }


    function savePlan() {

      if (currentView === "mealType") {
        collectMealTypeInputs();
      }

      if (currentView === "day") {
        collectDayInputs();
      }

      localStorage.setItem(
        "mealPlanner",
        JSON.stringify(mealPlan)
      );

      alert("Your meal plan has been saved!");

    }


    function startNewWeek() {

      const confirmed = confirm(
        "Start a new week?\n\n" +
        "This will clear all meals from the current week.\n\n" +
        "Your saved recipes will NOT be deleted."
      );

      if (!confirmed) {
        return;
      }

      mealPlan = {};

      localStorage.removeItem("mealPlanner");

      selectedDay = 0;

      showView("mealType");

      alert("Your new week is ready!");

    }

function loadRecipePickers() {

  const recipes = JSON.parse(
    localStorage.getItem("recipes") || "[]"
  );

  const pickers = document.querySelectorAll(".recipe-picker");

  pickers.forEach(picker => {

    picker.innerHTML =
      '<option value="">Choose a saved recipe...</option>';

    recipes.forEach(recipe => {

      const option = document.createElement("option");

      option.value = recipe.id;
      option.textContent = recipe.name;

      picker.appendChild(option);

    });

  });

}
    // Start on the Meal Type view
   loadRecipePickers();
showView("mealType");

  </script>

</body>
</html>

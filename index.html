<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ef;
            color: #292929;
        }

        header {
            background: #292929;
            color: white;
            padding: 26px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            opacity: 0.8;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 10px;
            background: white;
            border-bottom: 1px solid #ddd;
            overflow-x: auto;
        }

        nav button {
            background: transparent;
            color: #292929;
            border: none;
            padding: 10px 13px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
        }

        nav button:hover {
            background: #eee;
        }

        main {
            max-width: 1500px;
            margin: 0 auto;
            padding: 24px 16px 50px;
        }

        .page-heading {
            margin-bottom: 20px;
        }

        .page-heading h2 {
            margin: 0 0 6px;
        }

        .page-heading p {
            margin: 0;
            color: #666;
        }

        /*
         * CALENDAR
         */

        .calendar-wrapper {
            width: 100%;
            overflow-x: auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, minmax(150px, 1fr));
            min-width: 1050px;
        }

        .day-column {
            border-right: 1px solid #ddd;
            min-height: 600px;
        }

        .day-column:last-child {
            border-right: none;
        }

        .day-header {
            background: #292929;
            color: white;
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .meal {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .meal:last-child {
            border-bottom: none;
        }

        .meal-label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .meal-input {
            width: 100%;
            min-height: 42px;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
            background: #fafafa;
        }

        .meal-input:focus {
            outline: none;
            border-color: #555;
            background: white;
        }

        .save-button {
            display: block;
            margin: 22px auto 0;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #292929;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .save-button:hover {
            opacity: 0.85;
        }

        .save-message {
            text-align: center;
            color: #555;
            font-size: 14px;
            min-height: 20px;
            margin-top: 12px;
        }

        /*
         * MOBILE
         */

        @media (max-width: 700px) {

            header h1 {
                font-size: 24px;
            }

            main {
                padding: 20px 10px 40px;
            }

            .page-heading {
                padding-left: 4px;
            }

            .calendar-wrapper {
                border-radius: 10px;
            }

            .calendar {
                min-width: 980px;
            }

            .day-column {
                min-height: 550px;
            }

            .meal {
                padding: 10px;
            }

            .meal-label {
                font-size: 12px;
            }

            .meal-input {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Meal Planner</h1>
    <p>Plan meals. Build your grocery list.</p>
</header>

<nav>
    <button>🏠 Home</button>
    <button>📅 Meal Plan</button>
    <button>🍳 Recipes</button>
    <button>🛒 Grocery List</button>
    <button>📦 Pantry</button>
</nav>

<main>

    <div class="page-heading">
        <h2>This Week</h2>
        <p>Plan your meals from Monday through Sunday.</p>
    </div>

    <div class="calendar-wrapper">
        <div class="calendar" id="mealPlan"></div>
    </div>

    <button class="save-button" onclick="saveMealPlan()">
        Save Meal Plan
    </button>

    <div class="save-message" id="saveMessage"></div>

</main>

<script>

    const days = [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday"
    ];

    const mealTypes = [
        {
            key: "breakfast",
            name: "🍳 Breakfast"
        },
        {
            key: "drink",
            name: "🥤 Drink"
        },
        {
            key: "lunch",
            name: "🥪 Lunch"
        },
        {
            key: "snack",
            name: "🍎 Snack"
        },
        {
            key: "dinner",
            name: "🍽️ Dinner"
        }
    ];

    function createMealPlan() {

        const container = document.getElementById("mealPlan");

        container.innerHTML = "";

        days.forEach((day, dayIndex) => {

            const dayColumn = document.createElement("div");

            dayColumn.className = "day-column";

            const dayHeader = document.createElement("div");

            dayHeader.className = "day-header";

            dayHeader.textContent = day;

            dayColumn.appendChild(dayHeader);

            mealTypes.forEach(meal => {

                const mealBox = document.createElement("div");

                mealBox.className = "meal";

                const label = document.createElement("label");

                label.className = "meal-label";

                label.textContent = meal.name;

                const input = document.createElement("input");

                input.className = "meal-input";

                input.type = "text";

                input.placeholder = "Add meal...";

                input.dataset.day = dayIndex;

                input.dataset.meal = meal.key;

                mealBox.appendChild(label);

                mealBox.appendChild(input);

                dayColumn.appendChild(mealBox);
            });

            container.appendChild(dayColumn);
        });

        loadMealPlan();
    }

    function saveMealPlan() {

        const inputs = document.querySelectorAll(".meal-input");

        const mealPlan = {};

        inputs.forEach(input => {

            const key =
                input.dataset.day +
                "_" +
                input.dataset.meal;

            mealPlan[key] = input.value;
        });

        localStorage.setItem(
            "mealPlanner",
            JSON.stringify(mealPlan)
        );

        document.getElementById("saveMessage").textContent =
            "Meal plan saved.";

        setTimeout(() => {

            document.getElementById("saveMessage").textContent = "";

        }, 2500);
    }

    function loadMealPlan() {

        const saved =
            localStorage.getItem("mealPlanner");

        if (!saved) {
            return;
        }

        const mealPlan =
            JSON.parse(saved);

        const inputs =
            document.querySelectorAll(".meal-input");

        inputs.forEach(input => {

            const key =
                input.dataset.day +
                "_" +
                input.dataset.meal;

            if (mealPlan[key]) {

                input.value =
                    mealPlan[key];
            }
        });
    }

    createMealPlan();

</script>

</body>
</html>
